<!DOCTYPE html>
<html>
	<!-- Metadata Section -->
    <head>
        <title>Contact Us</title>
        <link rel="stylesheet" href="../css/main.css">  
        <meta charset="UTF-8">
        <meta name="authors" content="Sean Bartlett">
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Makes the page display universally on screens of any size -->
    </head>
    <body>
		<!-- Header - Displays the title of the page above the navigation bar -->
        <header>
            <h1>Contact Us</h1>
        </header>
		<!-- Navigation bar links all the pages together using relative file paths -->
        <nav> 
			<a href="../index.html">Home</a>
			<a href="about.html">About Us</a>
            <a href="destination.html">Destinations</a>
            <a href="feedback.html">Feedback</a>
		</nav>
		<img src="../media/contact.png" id="contact" alt="Stock image of a call centre">
        <p>Our contact options are listed below</p>
        <h2>Contact Form</h2>
		<!-- The contact form includes two personal info text boxes and a larger text area for the contact query itself, this form is just a simulation but could be made to store the data -->
        <form>
            <label for="email">Email address:</label><br>
            <input type="text" id="email" name="email"><br>
            <label for="fn">Full name:</label><br>
            <input type="text" id="fn" name="fn"><br>
	    <label for="query">Query:</label><br>
            <textarea id="query" name="query"></textarea><br><br>
            <input type="submit" value="Submit">
        </form>
        <h3>Phone Number</h3>
        <p id="phone">087 123 4567</p>
    </body>
</html>
